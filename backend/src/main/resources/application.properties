server.port=8080

# Database Configuration with hardcoded fallbacks to your Aiven MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-31d78a07-wellnessgrid.d.aivencloud.com:23406/defaultdb?sslmode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_AIVEN_PASSWORD_HERE}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false